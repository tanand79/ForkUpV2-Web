version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    # next.config.ts uses output: "export" → static files land in out/
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
